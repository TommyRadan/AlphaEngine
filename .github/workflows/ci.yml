name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DIRS: "runtime core rendering_engine external"
  CLANG_VERSION: "18"
  # Dev packages every Linux job that configures the tree installs. SDL3 is
  # built from source via FetchContent and on Linux its CMake refuses to
  # configure without the X11 (or Wayland) development libraries, even for a
  # build that never opens a window; the root CMakeLists calls
  # find_package(OpenGL / Vulkan REQUIRED) unconditionally, so the GL and
  # Vulkan loader headers are needed even by a test-only build.
  LINUX_DEV_PACKAGES: >-
    cmake
    ninja-build
    libgl1-mesa-dev
    libvulkan-dev
    libx11-dev
    libxext-dev
    libxrandr-dev
    libxcursor-dev
    libxi-dev
    libxfixes-dev
    libxss-dev

# The Linux jobs share one actions/cache of the FetchContent checkouts
# (SDL3, GLM, glslang, ImGui, GoogleTest) so only the first job after a
# CMakeLists.txt change hits GitHub for the sources. Both the *-src trees
# and the *-subbuild directories are cached: FetchContent skips the clone
# only when the "<name>-populate-gitclone-lastrun.txt" stamp inside the
# subbuild is present and up to date, and with the pinned tag already
# checked out the update step is a no-op — a restored cache never touches
# the network. The *-build trees are left out: they hold compiled objects
# that differ per compiler and per sanitizer flag.

jobs:
  # ---------------------------------------------------------------------------
  # clang-format: style gate. Runs on Ubuntu with a pinned LLVM version so the
  # formatting output is deterministic. This job does not compile.
  # ---------------------------------------------------------------------------
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format ${{ env.CLANG_VERSION }}
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-${CLANG_VERSION}
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-${CLANG_VERSION} 100
          clang-format --version

      - name: Verify .clang-format is committed
        run: test -f .clang-format

      - name: Run clang-format --dry-run -Werror
        run: |
          set -euo pipefail
          files=$(find ${SOURCE_DIRS} -type f \( -name '*.cpp' -o -name '*.hpp' \) -print)
          if [ -z "${files}" ]; then
            echo "No source files found under: ${SOURCE_DIRS}" >&2
            exit 1
          fi
          echo "Checking $(echo "${files}" | wc -l) files"
          echo "${files}" | xargs clang-format --style=file --dry-run -Werror

  # ---------------------------------------------------------------------------
  # clang-tidy: static analysis. Runs on Linux where clang-tidy + libc++ come
  # from the distro with working include paths. Every dependency is fetched
  # from source by CMake via FetchContent during configure, so no system
  # SDL / GLM package is required.
  # ---------------------------------------------------------------------------
  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and dev headers
        run: |
          set -euxo pipefail
          sudo apt-get update
          # CMakeLists.txt passes -stdlib=libc++ when the compiler is Clang, so
          # clang-tidy needs libc++ headers (not libstdc++) to resolve <cstdint>,
          # <functional>, <string>, etc. during analysis.
          sudo apt-get install -y --no-install-recommends ${LINUX_DEV_PACKAGES} \
            clang-${CLANG_VERSION} \
            clang-tidy-${CLANG_VERSION} \
            libc++-${CLANG_VERSION}-dev \
            libc++abi-${CLANG_VERSION}-dev
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-${CLANG_VERSION} 100
          sudo update-alternatives --install /usr/bin/run-clang-tidy run-clang-tidy /usr/bin/run-clang-tidy-${CLANG_VERSION} 100
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${CLANG_VERSION} 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${CLANG_VERSION} 100
          clang-tidy --version

      - name: Verify .clang-tidy is committed
        run: test -f .clang-tidy

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-${{ runner.os }}-

      - name: Configure (export compile_commands.json)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build glad (resolves generated GL headers for tidy)
        run: cmake --build build --target glad

      - name: Run run-clang-tidy on subsystem sources
        run: |
          set -euo pipefail
          # Anchor to the workspace root so the regex matches only the
          # repo's top-level modules and not vendored sources that happen
          # to live under a like-named subdirectory (e.g. SDL3's
          # build/_deps/sdl3-src/src/core/).
          pattern="${GITHUB_WORKSPACE}/(runtime|core|rendering_engine|external)/"
          run-clang-tidy -p build -quiet "${pattern}"

  # ---------------------------------------------------------------------------
  # build-linux: compile the full AlphaEngine target (both GPU backends, both
  # windowing paths, glslang, ImGui) with GCC and with Clang + libc++ on
  # Linux, then build and run the device-free unit-test suite (tests/,
  # GoogleTest) through ctest. The engine binary itself cannot run here —
  # there is no display and no headless mode yet — so the job proves that the
  # tree compiles and links on both Linux toolchains and that the tests pass
  # on each; with only the MSVC matrix a Linux-only breakage outside the test
  # TUs would keep CI green.
  # ---------------------------------------------------------------------------
  build-linux:
    name: build (linux-${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            cmake_args: ""
          - compiler: clang
            cc: clang
            cxx: clang++
            # CMakeLists.txt puts the AlphaEngine target on libc++ but leaves
            # the fetched C++ dependencies (glslang, ImGui, GoogleTest) on the
            # default libstdc++, and a libc++ TU cannot link a libstdc++
            # glslang (std::__1::vector vs std::vector in the mangled names).
            # Build the whole tree against libc++ so the engine links.
            cmake_args: -DCMAKE_CXX_FLAGS=-stdlib=libc++
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and dev headers
        run: |
          set -euxo pipefail
          sudo apt-get update
          case "${{ matrix.compiler }}" in
            gcc)
              sudo apt-get install -y --no-install-recommends ${LINUX_DEV_PACKAGES} g++
              ;;
            clang)
              # CMakeLists.txt passes -stdlib=libc++ to the AlphaEngine target
              # when the compiler is Clang, so the libc++ headers and runtime
              # are needed to compile and link the engine.
              sudo apt-get install -y --no-install-recommends ${LINUX_DEV_PACKAGES} \
                clang-${CLANG_VERSION} \
                libc++-${CLANG_VERSION}-dev \
                libc++abi-${CLANG_VERSION}-dev
              sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${CLANG_VERSION} 100
              sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${CLANG_VERSION} 100
              ;;
          esac
          ${{ matrix.cxx }} --version

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DALPHAENGINE_BUILD_TESTS=ON \
            ${{ matrix.cmake_args }}

      - name: Build engine and tests
        run: cmake --build build --target AlphaEngine AlphaEngineTests

      - name: Verify output
        run: |
          set -euo pipefail
          exe=Binaries/AlphaEngine
          if [ ! -x "${exe}" ]; then
            echo "Missing ${exe}" >&2
            exit 1
          fi
          echo "Built ${exe} ($(stat -c %s "${exe}") bytes)"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # sanitizers: the unit-test suite under AddressSanitizer + UndefinedBehavior
  # Sanitizer, and the threaded suites under ThreadSanitizer. Both are GCC
  # Debug builds configured with ALPHAENGINE_SANITIZE (root CMakeLists.txt),
  # which instruments every target — the fetched SDL3 and GoogleTest too — so
  # a report inside dependency code carries a usable stack.
  #
  # ASan and TSan cannot share a binary, so TSan is a second matrix entry with
  # its own build. It runs only the suites that exercise threads (core::jobs,
  # core::time, core::event_bus, core::pool) and repeats them 20 times in one
  # process so a race that needs an unlucky interleaving has a chance to show
  # up; the whole suite would mostly be single-threaded noise at TSan's cost.
  #
  # The gtest binary is run directly for the TSan entry because ctest cannot
  # forward --gtest_repeat; the ASan entry goes through ctest like the build
  # jobs do. UBSan keeps running after a report by default (exit 0), so
  # halt_on_error=1 is what turns a finding into a failed step; ASan aborts on
  # its first error and LeakSanitizer exits non-zero at process end; TSan
  # reports every race and exits 66 at the end of the run.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: sanitizers (linux ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan+ubsan
            sanitize: address,undefined
          - name: tsan
            sanitize: thread
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and dev headers
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${LINUX_DEV_PACKAGES} g++
          g++ --version

      # GCC 13's libasan / libtsan abort at startup ("unexpected memory
      # mapping") when the kernel randomises mmap with more than 28 bits of
      # entropy. The runner images set vm.mmap_rnd_bits=28 for exactly this
      # reason, but the kernel default is 32, so pin it rather than depend on
      # the image (actions/runner-images#9491).
      - name: Limit mmap randomisation for the sanitizer runtimes
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-${{ runner.os }}-

      - name: Configure (-fsanitize=${{ matrix.sanitize }})
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DALPHAENGINE_BUILD_TESTS=ON \
            -DALPHAENGINE_SANITIZE=${{ matrix.sanitize }}

      - name: Build tests
        run: cmake --build build --target AlphaEngineTests

      - name: Run tests (ctest)
        if: matrix.name == 'asan+ubsan'
        run: ctest --test-dir build --output-on-failure

      - name: Run threaded suites 20x
        if: matrix.name == 'tsan'
        run: |
          Binaries/AlphaEngineTests \
            --gtest_filter='jobs.*:time.*:event_bus.*:pool.*' \
            --gtest_repeat=20

  # ---------------------------------------------------------------------------
  # build: Windows MSVC build matrix (Debug + Release). Both the OpenGL and
  # Vulkan backends are compiled into the same binary and the runtime choice
  # is driven by settings::get_graphics_backend(); the Vulkan SDK is therefore
  # an unconditional build dependency. The SDK comes from the LunarG installer
  # at a pinned version so the job is reproducible; CMake's find_package(Vulkan)
  # picks it up through the VULKAN_SDK environment variable. glslang is fetched
  # from source by CMake (used both for the OpenGL ARB_gl_spirv path and the
  # Vulkan backend's shader compile). The Khronos validation layer is staged
  # alongside the executable so reviewers can run with VK validation enabled
  # without a system-wide SDK install.
  # ---------------------------------------------------------------------------
  build:
    name: build (windows-msvc ${{ matrix.configuration }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      VULKAN_SDK_VERSION: "1.3.296.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $version = "${env:VULKAN_SDK_VERSION}"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
          Write-Host "Downloading Vulkan SDK $version from $url"
          # The LunarG download is large and occasionally drops mid-transfer
          # ("connection forcibly closed"), so retry with backoff rather than
          # failing the whole job on a single transient network error.
          $maxAttempts = 4
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++)
          {
            try
            {
              Invoke-WebRequest -Uri $url -OutFile VulkanSDK.exe -UseBasicParsing
              break
            }
            catch
            {
              if ($attempt -eq $maxAttempts) { throw }
              $delay = [math]::Pow(2, $attempt)
              Write-Host "Download attempt $attempt failed: $($_.Exception.Message). Retrying in $delay s..."
              Start-Sleep -Seconds $delay
            }
          }
          # Silent install: --accept-licenses --default-answer --confirm-command
          # are the LunarG installer's unattended flags.
          Start-Process -FilePath .\VulkanSDK.exe `
            -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" `
            -Wait -NoNewWindow
          $sdk = "C:\VulkanSDK\$version"
          if (-not (Test-Path $sdk)) { throw "Vulkan SDK install failed: $sdk missing" }
          # Publish VULKAN_SDK + PATH so subsequent steps' find_package(Vulkan)
          # locates the headers and loader.
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Installed Vulkan SDK at $sdk"

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: build-msvc-${{ matrix.configuration }}-${{ env.VULKAN_SDK_VERSION }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            build-msvc-${{ matrix.configuration }}-${{ env.VULKAN_SDK_VERSION }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            build-msvc-${{ matrix.configuration }}-${{ env.VULKAN_SDK_VERSION }}-

      - name: Configure (MSVC)
        shell: pwsh
        run: |
          # windows-latest ships Visual Studio 2026 (generator v18); the
          # older "Visual Studio 17 2022" is no longer installed on the
          # image, so configure against the 2026 toolchain.
          cmake -S . -B build `
            -G "Visual Studio 18 2026" `
            -A x64
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config ${{ matrix.configuration }}
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }

      - name: Verify output
        shell: pwsh
        run: |
          $exe = "Binaries\${{ matrix.configuration }}\AlphaEngine.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          Write-Host "Built $exe ($((Get-Item $exe).Length) bytes)"

      # Stage the Khronos validation layer alongside the executable so
      # the Debug artifact is debuggable on a machine that does not
      # have the LunarG SDK installed. vk_device::create_instance()
      # points VK_LAYER_PATH at the executable directory when it
      # spots the bundled manifest, so dropping these files next to
      # AlphaEngine.exe is enough to enable validation at runtime.
      # Release builds do not ship the layer — validation is a
      # debug-time aid.
      - name: Stage validation layer
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          $sdkBin = "$env:VULKAN_SDK\Bin"
          $outDir = "Binaries\${{ matrix.configuration }}"
          $files = @(
            "VkLayer_khronos_validation.dll",
            "VkLayer_khronos_validation.json"
          )
          foreach ($f in $files) {
            $src = Join-Path $sdkBin $f
            if (-not (Test-Path $src)) { throw "Missing $src" }
            Copy-Item $src $outDir -Force
            Write-Host "Staged $f"
          }

      - name: Upload build artifact (Debug)
        if: matrix.configuration == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: AlphaEngine-windows-Debug
          path: |
            Binaries/Debug/AlphaEngine.exe
            Binaries/Debug/VkLayer_khronos_validation.dll
            Binaries/Debug/VkLayer_khronos_validation.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload build artifact (Release)
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: AlphaEngine-windows-Release
          path: Binaries/Release/AlphaEngine.exe
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # comment-artifacts: on pull requests, post (or update) a sticky comment
  # linking to the workflow run summary where the uploaded Debug/Release
  # artifacts can be downloaded. Gated on successful build.
  # ---------------------------------------------------------------------------
  comment-artifacts:
    name: comment-artifacts
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request' && needs.build.result == 'success'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- ci-artifacts-comment -->';
            const body = [
              marker,
              '### CI build artifacts',
              '',
              `Windows Debug and Release builds are attached to the [workflow run summary](${runUrl}) under **Artifacts**:`,
              '',
              '- `AlphaEngine-windows-Debug` — Debug `AlphaEngine.exe` + Khronos validation layer',
              '- `AlphaEngine-windows-Release` — Release `AlphaEngine.exe`',
              '',
              `_Run [#${context.runNumber}](${runUrl}) — commit \`${context.sha.slice(0, 7)}\`._`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const prior = existing.find(c => c.body && c.body.includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
