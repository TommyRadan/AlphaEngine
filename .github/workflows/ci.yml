name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DIRS: "runtime core platform assets rendering_engine editor app external"
  CLANG_VERSION: "18"
  # Dev packages every Linux job that configures the tree installs. SDL3 is
  # built from source via FetchContent and on Linux its CMake refuses to
  # configure without the X11 (or Wayland) development libraries, even for a
  # build that never opens a window; the root CMakeLists calls
  # find_package(Vulkan REQUIRED) unconditionally, so every job that
  # configures needs the Vulkan loader headers.
  LINUX_DEV_PACKAGES: >-
    cmake
    ninja-build
    libvulkan-dev
    libx11-dev
    libxext-dev
    libxrandr-dev
    libxcursor-dev
    libxi-dev
    libxfixes-dev
    libxss-dev

# Every job that configures the tree caches the FetchContent checkouts
# (every FetchContent_Declare dependency in the root CMakeLists.txt)
# via actions/cache, one entry per OS, so only the first job after a
# CMakeLists.txt change hits GitHub for the sources. The *-build trees
# are left out: each job's own ccache/sccache cache (below) covers
# compiled objects at per-translation-unit granularity instead.

jobs:
  # ---------------------------------------------------------------------------
  # clang-format: style gate. Runs on Ubuntu with a pinned LLVM version so the
  # formatting output is deterministic. This job does not compile.
  # ---------------------------------------------------------------------------
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format ${{ env.CLANG_VERSION }}
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-${CLANG_VERSION}
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-${CLANG_VERSION} 100
          clang-format --version

      - name: Verify .clang-format is committed
        run: test -f .clang-format

      - name: Run clang-format --dry-run -Werror
        run: |
          set -euo pipefail
          files=$(find ${SOURCE_DIRS} -type f \( -name '*.cpp' -o -name '*.hpp' \) -print)
          if [ -z "${files}" ]; then
            echo "No source files found under: ${SOURCE_DIRS}" >&2
            exit 1
          fi
          echo "Checking $(echo "${files}" | wc -l) files"
          echo "${files}" | xargs clang-format --style=file --dry-run -Werror

      - name: Check SPDX licence lines
        run: |
          set -euo pipefail
          # Every first-party source, shader, build file, script and workflow
          # must start with the SPDX identifier line (line 2 after a shebang).
          # Directory pathspecs recurse; vendor/ is deliberately not listed.
          files=$(git ls-files -- core platform runtime assets rendering_engine editor app external shaders cmake scripts CMakeLists.txt .github/workflows \
            | grep -E '(\.(cpp|hpp|h|c|glsl|cmake|ps1|yml)|CMakeLists\.txt)$')
          echo "Checking $(echo "${files}" | wc -l) files"
          failed=0
          for file in ${files}; do
            line_to_check=1
            if head -1 "$file" | grep -q '^#!'; then
              line_to_check=2
            fi
            if ! sed -n "${line_to_check}p" "$file" | grep -q 'SPDX-License-Identifier: MIT'; then
              echo "Missing SPDX header: $file"
              failed=1
            fi
          done
          if [ $failed -ne 0 ]; then
            echo "SPDX licence check failed"
            exit 1
          fi
          echo "SPDX licence check passed"

  # ---------------------------------------------------------------------------
  # clang-tidy: static analysis. Runs on Linux where clang-tidy + libc++ come
  # from the distro with working include paths. Every dependency is fetched
  # from source by CMake via FetchContent during configure, so no system
  # SDL / GLM package is required.
  # ---------------------------------------------------------------------------
  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and dev headers
        run: |
          set -euxo pipefail
          sudo apt-get update
          # CMakeLists.txt passes -stdlib=libc++ when the compiler is Clang, so
          # clang-tidy needs libc++ headers (not libstdc++) to resolve <cstdint>,
          # <functional>, <string>, etc. during analysis.
          sudo apt-get install -y --no-install-recommends ${LINUX_DEV_PACKAGES} \
            clang-${CLANG_VERSION} \
            clang-tidy-${CLANG_VERSION} \
            libc++-${CLANG_VERSION}-dev \
            libc++abi-${CLANG_VERSION}-dev
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-${CLANG_VERSION} 100
          sudo update-alternatives --install /usr/bin/run-clang-tidy run-clang-tidy /usr/bin/run-clang-tidy-${CLANG_VERSION} 100
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${CLANG_VERSION} 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${CLANG_VERSION} 100
          clang-tidy --version

      - name: Verify .clang-tidy is committed
        run: test -f .clang-tidy

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-${{ runner.os }}-

      - name: Configure (export compile_commands.json)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Run run-clang-tidy on subsystem sources
        run: |
          set -euo pipefail
          # Anchor to the workspace root so the regex matches only the
          # repo's top-level modules and not vendored sources that happen
          # to live under a like-named subdirectory (e.g. SDL3's
          # build/_deps/sdl3-src/src/core/).
          pattern="${GITHUB_WORKSPACE}/(runtime|core|platform|assets|rendering_engine|editor|app|external)/"
          run-clang-tidy -p build -quiet "${pattern}"

  # ---------------------------------------------------------------------------
  # build-linux: compile the full AlphaEngine target (the Vulkan backend,
  # glslang, ImGui, and every game module the projects under projects/
  # run) with GCC and with Clang + libc++ on Linux. The binary itself is
  # not run here — see the smoke job below for that — so this job proves
  # that the tree compiles and links on both Linux toolchains; with only
  # the MSVC matrix a Linux-only breakage would keep CI green.
  # ---------------------------------------------------------------------------
  build-linux:
    name: build (linux-${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            cmake_args: ""
          - compiler: clang
            cc: clang
            cxx: clang++
            # CMakeLists.txt puts the AlphaEngine target on libc++ but leaves
            # the fetched C++ dependencies (glslang, ImGui) on the default
            # libstdc++, and a libc++ TU cannot link a libstdc++ glslang
            # (std::__1::vector vs std::vector in the mangled names). Build
            # the whole tree against libc++ so the engine links.
            cmake_args: -DCMAKE_CXX_FLAGS=-stdlib=libc++
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and dev headers
        run: |
          set -euxo pipefail
          sudo apt-get update
          case "${{ matrix.compiler }}" in
            gcc)
              sudo apt-get install -y --no-install-recommends ${LINUX_DEV_PACKAGES} ccache g++
              ;;
            clang)
              # CMakeLists.txt passes -stdlib=libc++ to the AlphaEngine target
              # when the compiler is Clang, so the libc++ headers and runtime
              # are needed to compile and link the engine.
              sudo apt-get install -y --no-install-recommends ${LINUX_DEV_PACKAGES} ccache \
                clang-${CLANG_VERSION} \
                libc++-${CLANG_VERSION}-dev \
                libc++abi-${CLANG_VERSION}-dev
              sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${CLANG_VERSION} 100
              sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${CLANG_VERSION} 100
              ;;
          esac
          ${{ matrix.cxx }} --version

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-${{ runner.os }}-

      # Keyed on compiler and configuration (this job is always a Debug
      # build) so the two matrix legs, which compile different object
      # files from the same sources (GCC vs. Clang + libc++), never share
      # or overwrite each other's cache entry.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-${{ matrix.compiler }}-debug-${{ github.sha }}
          restore-keys: ccache-linux-${{ matrix.compiler }}-debug-

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ${{ matrix.cmake_args }}

      - name: Build engine
        run: cmake --build build --target AlphaEngine

      - name: Verify output
        run: |
          set -euo pipefail
          if [ ! -x Binaries/AlphaEngine ]; then
            echo "Missing Binaries/AlphaEngine" >&2
            exit 1
          fi
          echo "Built Binaries/AlphaEngine ($(stat -c %s Binaries/AlphaEngine) bytes)"
          if [ ! -f Binaries/project.json ]; then
            echo "Missing Binaries/project.json, the project AlphaEngine runs by default" >&2
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # smoke: launches the real Debug binary headlessly under Xvfb, on Mesa's
  # software Vulkan implementation (lavapipe) with the Khronos validation
  # layer, for a bounded number of frames (--frames), and fails the step on
  # any [ERR] or [FTL] line (--fail-on-error) — so a validation message, not
  # only a crash, fails CI. The default project runs twice: once with the
  # layer's default checks, once with synchronization validation added,
  # which catches a different class of hazard (a missing barrier) the
  # default checks miss. Every other project under projects/ then runs
  # once, for fewer frames, with the default checks: each installs game
  # modules the default project does not.
  #
  # A second matrix entry repeats both runs under AddressSanitizer +
  # UndefinedBehaviorSanitizer. Its leak check reads
  # .github/lsan-suppressions.txt, which covers the state libX11 keeps in its
  # own globals: SDL unloads the library at shutdown, so that state is
  # unreachable by the time LeakSanitizer runs. ThreadSanitizer is left out:
  # lavapipe's own worker threads produce driver-internal races that would
  # need a suppressions file, and none of it is engine code.
  # ---------------------------------------------------------------------------
  smoke:
    name: smoke (linux vulkan ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain
            cmake_args: ""
          - name: asan+ubsan
            cmake_args: -DALPHAENGINE_SANITIZE=address,undefined
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
      ALPHAENGINE_GRAPHICS_BACKEND: vulkan
      SDL_AUDIO_DRIVER: dummy
      ASAN_OPTIONS: detect_leaks=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan-suppressions.txt:print_suppressions=0
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and dev headers
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${LINUX_DEV_PACKAGES} ccache g++ \
            mesa-vulkan-drivers vulkan-validationlayers xvfb
          g++ --version

      # GCC 13's libasan aborts at startup ("unexpected memory mapping") when
      # the kernel randomises mmap with more than 28 bits of entropy. The
      # runner images set vm.mmap_rnd_bits=28 for exactly this reason, but
      # the kernel default is 32, so pin it rather than depend on the image
      # (actions/runner-images#9491); only the sanitizer entry links libasan.
      - name: Limit mmap randomisation for the sanitizer runtime
        if: matrix.name == 'asan+ubsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-${{ runner.os }}-

      # Keyed on matrix.name (plain vs. asan+ubsan), not just compiler and
      # configuration: -fsanitize=address,undefined changes every object
      # file, and without a distinct key both matrix legs would race to
      # save the same cache entry, silently dropping whichever leg's save
      # loses the race.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-smoke-${{ matrix.name }}-debug-${{ github.sha }}
          restore-keys: ccache-linux-smoke-${{ matrix.name }}-debug-

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ${{ matrix.cmake_args }}

      - name: Build engine
        run: cmake --build build --target AlphaEngine

      # A smaller window than the engine's own default keeps lavapipe's
      # software rasterizer inside the timeout below; it renders only a few
      # frames per second at the default resolution.
      - name: Smoke run (validation)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          xvfb-run -a ./Binaries/AlphaEngine \
            --width 640 --height 360 --frames 300 --fail-on-error \
            2>&1 | tee smoke-validation.log

      - name: Smoke run (synchronization validation)
        timeout-minutes: 8
        env:
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
        run: |
          set -euo pipefail
          xvfb-run -a ./Binaries/AlphaEngine \
            --width 640 --height 360 --frames 300 --fail-on-error \
            2>&1 | tee smoke-sync-validation.log

      - name: Smoke run (demo projects)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          for project in projects/*/; do
            name=$(basename "${project}")
            if [ "${name}" = showcase ]; then
              continue
            fi
            echo "::group::${name}"
            xvfb-run -a ./Binaries/AlphaEngine --project "${project}" \
              --width 640 --height 360 --frames 60 --fail-on-error \
              2>&1 | tee "smoke-project-${name}.log"
            echo "::endgroup::"
          done

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ matrix.name }}
          path: smoke-*.log
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # build: Windows MSVC build matrix (Debug + Release), building the default
  # target (AlphaEngine, with every game module). The Vulkan SDK is an
  # unconditional build dependency. The SDK comes from the LunarG installer
  # at a pinned version so the job is reproducible; CMake's find_package(Vulkan)
  # picks it up through the VULKAN_SDK environment variable. glslang is fetched
  # from source by CMake for the Vulkan backend's shader compile. The Khronos
  # validation layer is staged alongside the executable so reviewers can run
  # with VK validation enabled without a system-wide SDK install.
  #
  # Configures with Ninja instead of a Visual Studio generator:
  # CMAKE_<LANG>_COMPILER_LAUNCHER, the hook sccache needs, is
  # documented as supported only by the Makefile and Ninja generators.
  # ilammy/msvc-dev-cmd loads cl.exe / link.exe onto PATH so Ninja can
  # drive them; the executable then lands directly under Binaries/.
  # ---------------------------------------------------------------------------
  build:
    name: build (windows-msvc ${{ matrix.configuration }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      VULKAN_SDK_VERSION: "1.3.296.0"
      SCCACHE_VERSION: "0.18.0"
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_CACHE_SIZE: 1G
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $version = "${env:VULKAN_SDK_VERSION}"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
          Write-Host "Downloading Vulkan SDK $version from $url"
          # The LunarG download is large and occasionally drops mid-transfer
          # ("connection forcibly closed"), so retry with backoff rather than
          # failing the whole job on a single transient network error.
          $maxAttempts = 4
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++)
          {
            try
            {
              Invoke-WebRequest -Uri $url -OutFile VulkanSDK.exe -UseBasicParsing
              break
            }
            catch
            {
              if ($attempt -eq $maxAttempts) { throw }
              $delay = [math]::Pow(2, $attempt)
              Write-Host "Download attempt $attempt failed: $($_.Exception.Message). Retrying in $delay s..."
              Start-Sleep -Seconds $delay
            }
          }
          # Silent install: --accept-licenses --default-answer --confirm-command
          # are the LunarG installer's unattended flags.
          Start-Process -FilePath .\VulkanSDK.exe `
            -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" `
            -Wait -NoNewWindow
          $sdk = "C:\VulkanSDK\$version"
          if (-not (Test-Path $sdk)) { throw "Vulkan SDK install failed: $sdk missing" }
          # Publish VULKAN_SDK + PATH so subsequent steps' find_package(Vulkan)
          # locates the headers and loader.
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Installed Vulkan SDK at $sdk"

      # Downloaded directly from the project's GitHub releases, the same
      # pinned-version-plus-retry pattern as the Vulkan SDK step above,
      # rather than a marketplace action: sccache is a small, single-file
      # download and this keeps the compiler cache's own provenance under
      # the same control as the rest of this job.
      - name: Install sccache
        shell: pwsh
        run: |
          $version = "${env:SCCACHE_VERSION}"
          $archive = "sccache-v$version-x86_64-pc-windows-msvc"
          $url = "https://github.com/mozilla/sccache/releases/download/v$version/$archive.zip"
          Write-Host "Downloading sccache $version from $url"
          $maxAttempts = 4
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++)
          {
            try
            {
              Invoke-WebRequest -Uri $url -OutFile sccache.zip -UseBasicParsing
              break
            }
            catch
            {
              if ($attempt -eq $maxAttempts) { throw }
              $delay = [math]::Pow(2, $attempt)
              Write-Host "Download attempt $attempt failed: $($_.Exception.Message). Retrying in $delay s..."
              Start-Sleep -Seconds $delay
            }
          }
          Expand-Archive -Path sccache.zip -DestinationPath sccache-extracted
          $sccacheDir = (Resolve-Path "sccache-extracted\$archive").Path
          if (-not (Test-Path "$sccacheDir\sccache.exe")) { throw "sccache.exe missing after extraction" }
          $sccacheDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Installed sccache at $sccacheDir"

      # Loads cl.exe / link.exe onto PATH (via vswhere + vcvarsall) for the
      # Ninja configure below.
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-${{ runner.os }}-

      # Keyed on configuration (this job is always MSVC) so the Debug and
      # Release legs, which compile different object files, never share or
      # overwrite each other's cache entry.
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-windows-msvc-${{ matrix.configuration }}-${{ github.sha }}
          restore-keys: sccache-windows-msvc-${{ matrix.configuration }}-

      - name: Configure (MSVC)
        shell: pwsh
        run: |
          $ciArgs = @()
          if ('${{ matrix.configuration }}' -eq 'Debug')
          {
            # /Zi (CMake's default here) shares one PDB via mspdbsrv,
            # which sccache can't key per object; /Z7 embeds it in each
            # .obj instead. Release already has no debug-info flag.
            $ciArgs = @('-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded')
          }
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            @ciArgs
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }

      - name: Verify output
        shell: pwsh
        run: |
          $exe = "Binaries\AlphaEngine.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          Write-Host "Built $exe ($((Get-Item $exe).Length) bytes)"

      # Stage the Khronos validation layer alongside the executable so
      # the Debug artifact is debuggable on a machine that does not
      # have the LunarG SDK installed. The engine points VK_LAYER_PATH
      # at the executable directory when it spots the bundled manifest,
      # before it creates the GPU device, so dropping these files next
      # to AlphaEngine.exe is enough to enable validation at runtime.
      # Release builds do not ship the layer — validation is a
      # debug-time aid.
      - name: Stage validation layer
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          $sdkBin = "$env:VULKAN_SDK\Bin"
          $outDir = "Binaries"
          $files = @(
            "VkLayer_khronos_validation.dll",
            "VkLayer_khronos_validation.json"
          )
          foreach ($f in $files) {
            $src = Join-Path $sdkBin $f
            if (-not (Test-Path $src)) { throw "Missing $src" }
            Copy-Item $src $outDir -Force
            Write-Host "Staged $f"
          }

      - name: Upload build artifact (Debug)
        if: matrix.configuration == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: AlphaEngine-windows-Debug
          path: |
            Binaries/AlphaEngine.exe
            Binaries/VkLayer_khronos_validation.dll
            Binaries/VkLayer_khronos_validation.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload build artifact (Release)
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: AlphaEngine-windows-Release
          path: Binaries/AlphaEngine.exe
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # comment-artifacts: on pull requests, post (or update) a sticky comment
  # linking to the workflow run summary where the uploaded Debug/Release
  # artifacts can be downloaded. Gated on successful build.
  # ---------------------------------------------------------------------------
  comment-artifacts:
    name: comment-artifacts
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request' && needs.build.result == 'success'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- ci-artifacts-comment -->';
            const body = [
              marker,
              '### CI build artifacts',
              '',
              `Windows Debug and Release builds are attached to the [workflow run summary](${runUrl}) under **Artifacts**:`,
              '',
              '- `AlphaEngine-windows-Debug` — Debug `AlphaEngine.exe` + Khronos validation layer',
              '- `AlphaEngine-windows-Release` — Release `AlphaEngine.exe`',
              '',
              `_Run [#${context.runNumber}](${runUrl}) — commit \`${context.sha.slice(0, 7)}\`._`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const prior = existing.find(c => c.body && c.body.includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
